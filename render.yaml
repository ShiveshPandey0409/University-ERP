services:
  - type: pserv
    name: ptsnsu-erp-db
    runtime: image
    region: singapore
    plan: standard
    image:
      url: mcr.microsoft.com/mssql/server:2022-latest
    envVars:
      - key: ACCEPT_EULA
        value: "Y"
      - key: MSSQL_PID
        value: Express
      - key: MSSQL_SA_PASSWORD
        sync: false
    disk:
      name: ptsnsu-erp-db-data
      mountPath: /var/opt/mssql
      sizeGB: 10

  - type: web
    name: ptsnsu-erp-v2
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: ptsnsu-erp-db
          property: host
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: PSNSUniversityOnline
      - key: DB_USER
        value: sa
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: ODBC Driver 18 for SQL Server
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '[]'
      - key: JWT_SECRET
        generateValue: true
      - key: SABPAISA_CLIENT_CODE
        sync: false
      - key: SABPAISA_TRANS_USER
        sync: false
      - key: SABPAISA_TRANS_PASS
        sync: false
      - key: SABPAISA_AUTH_KEY
        sync: false
      - key: SABPAISA_AUTH_IV
        sync: false
      - key: SABPAISA_CALLBACK_URL
        value: https://ptsnsu-erp-v2.onrender.com/payments/callback
